<script src="../../dist/vue.global.js"></script>

<div id="demo">
  <div @click="handelClick()">watchEffect</div>
  <div @click="()=> count += 1">count + 1</div>
  <div>{{count}} {{doubleCount}}</div>
</div>

<script>
  const { createApp, ref, watchEffect, computed } = Vue

  createApp({
    setup() {
      const count = ref(1)

      const doubleCount = computed(() => {
        return count.value * 2
      })

      function handelClick() {
        watchEffect(() => {
          console.log('doubleCount', doubleCount.value)
        })
      }

      return {
        count,
        doubleCount,
        handelClick,
      }
    },
  }).mount('#demo')
</script>
